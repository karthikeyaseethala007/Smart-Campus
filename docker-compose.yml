version: '3.8'

services:
  # 1. Production Backend Service (API + WebSocket + Event Bus + Device Registry)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-backend
    restart: unless-stopped
    user: "1000:1000" # Run as unprivileged non-root user (SEC-MED-03)
    ports:
      - "127.0.0.1:8080:8080" # Loopback only; external traffic routes via reverse proxy web (SEC-MED-03)
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://campus_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured for deployment}@postgres:5432/smart_campus
      - DATABASE_POOL_MIN=4
      - DATABASE_POOL_MAX=25
      - MQTT_URL=mqtt://mqtt:1883
      - MQTT_USERNAME=${MQTT_USERNAME:-campus_service}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be configured for deployment}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be configured for deployment}
      - DEVICE_API_KEY=${DEVICE_API_KEY:?DEVICE_API_KEY must be configured for deployment}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://campus.internal}
      - RTSP_PROXY_URL=http://media-gateway:8554
      - REALTIME_MODE=live
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - campus-net

  # 2. Command Center Web Frontend (Static Serving & Reverse Proxy)
  web:
    image: nginx:alpine
    container_name: campus-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - campus-net

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: campus-postgres
    restart: unless-stopped
    ports:
      # Bound strictly to localhost for administrative operations; not exposed to 0.0.0.0 (SEC-MED-03)
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=campus_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured for deployment}
      - POSTGRES_DB=smart_campus
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_admin -d smart_campus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus-net

  # 4. MQTT Broker (Eclipse Mosquitto for Field Sensors & Access Nodes)
  mqtt:
    image: eclipse-mosquitto:2-openssl
    container_name: campus-mqtt
    restart: unless-stopped
    ports:
      # Loopback bound for development; production sensors connect via TLS on internal network (SEC-MED-03)
      - "127.0.0.1:1883:1883"
      - "8883:8883"
    volumes:
      - mqttdata:/mosquitto/data
    networks:
      - campus-net

  # 5. Media Gateway (MediaMTX for RTSP Camera Transcoding to HLS/WebRTC)
  media-gateway:
    image: bluenviron/mediamtx:latest
    container_name: campus-media-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554" # RTSP internal loopback (SEC-MED-03)
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
    environment:
      - MTX_PROTOCOLS=tcp
    networks:
      - campus-net

volumes:
  pgdata:
    driver: local
  mqttdata:
    driver: local

networks:
  campus-net:
    driver: bridge
