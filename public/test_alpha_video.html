<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Alpha Video Test</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #e8edf2 0%, #f4ebe1 50%, #d8e2ec 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    .container {
      position: relative;
      width: 960px;
      height: 540px;
      border: 1px dashed rgba(0,0,0,0.2);
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
    }
    .background-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: bold;
      color: rgba(0,0,0,0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Transparent Particle Asset Verification</h1>
  <div class="container">
    <div class="background-text">BACKGROUND VISIBLE BEHIND PARTICLES</div>
    <video id="v" src="/assets/hero/hero_particle_master_alpha.webm" poster="/assets/hero/poster.png" autoplay loop muted playsinline></video>
  </div>
</body>
</html>
